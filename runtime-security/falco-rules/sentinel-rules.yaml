# Part L — Runtime Security & Security Operations
# Falco runtime detection rules (industry-standard open-source runtime
# security engine). Detects the behaviours called out in Day 3 §7.3:
# unauthorized access, privilege misuse, container/runtime anomalies.

- rule: Sentinel - Unexpected Process in Container
  desc: >
    Detects a process launched inside a Sentinel-managed container that is
    not on the approved allow-list for that service.
  condition: >
    spawned_process and container and
    not proc.name in (approved_process_names)
  output: >
    Unexpected process in container (user=%user.name command=%proc.cmdline
    container=%container.name image=%container.image.repository)
  priority: HIGH
  tags: [sentinel, runtime, process]

- rule: Sentinel - Privilege Escalation Attempt
  desc: Detects setuid/setgid calls or capability changes inside a container.
  condition: >
    spawned_process and container and
    (proc.name in (sudo, su) or evt.type=setuid or evt.type=setgid)
  output: >
    Privilege escalation attempt (user=%user.name command=%proc.cmdline
    container=%container.name)
  priority: CRITICAL
  tags: [sentinel, runtime, privilege-escalation]

- rule: Sentinel - Container Escape Attempt
  desc: Detects an attempt to access the host filesystem or Docker socket from inside a container.
  condition: >
    open_read and container and
    (fd.name startswith /var/run/docker.sock or fd.name startswith /proc/1/root)
  output: >
    Possible container escape attempt (user=%user.name file=%fd.name
    container=%container.name)
  priority: CRITICAL
  tags: [sentinel, runtime, container-escape]

- rule: Sentinel - Unexpected Outbound Network Connection
  desc: >
    Detects a container making an outbound connection to a destination not
    in the approved egress allow-list (supports data-exfiltration detection).
  condition: >
    outbound and container and
    not fd.sip in (approved_egress_ips)
  output: >
    Unexpected outbound connection (container=%container.name
    dest=%fd.sip:%fd.sport)
  priority: HIGH
  tags: [sentinel, runtime, network, exfiltration]

- rule: Sentinel - Secret File Read at Runtime
  desc: Detects a runtime process reading a mounted secret file outside normal startup.
  condition: >
    open_read and container and
    fd.name glob "/run/secrets/*" and
    not proc.name in (approved_secret_readers)
  output: >
    Secret file accessed by unexpected process (proc=%proc.name
    file=%fd.name container=%container.name)
  priority: HIGH
  tags: [sentinel, runtime, secret]

# Lists referenced above — populate per-service during onboarding (Part S)
- list: approved_process_names
  items: [node, npm, python3, sh, bash]

- list: approved_egress_ips
  items: []   # populate with approved internal/external service IPs per repo

- list: approved_secret_readers
  items: [node, python3]

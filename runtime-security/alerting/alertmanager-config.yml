# Part L — Security Alerting: routing rules
# Maps detection severity to notification channel and escalation path,
# matching Day 3 §8.3 Severity & Escalation Matrix.

route:
  receiver: default-security-channel
  group_by: [alertname, severity, container]
  group_wait: 30s
  repeat_interval: 4h

  routes:
    - match:
        priority: CRITICAL
      receiver: sev1-pager
      continue: true
      group_wait: 0s          # page immediately, no batching

    - match:
        priority: HIGH
      receiver: sev2-oncall-channel
      continue: true

    - match:
        priority: WARNING
      receiver: sev3-review-queue

receivers:
  - name: default-security-channel
    webhook_configs:
      - url: "${SECURITY_ALERTS_WEBHOOK_URL}"

  - name: sev1-pager
    # Replace with real paging integration (PagerDuty, Opsgenie, etc.)
    webhook_configs:
      - url: "${SEV1_PAGER_WEBHOOK_URL}"
    # Escalation: on-call engineer + Platform Owner + CTO notified (Day 3 §8.3)

  - name: sev2-oncall-channel
    webhook_configs:
      - url: "${SEV2_ONCALL_WEBHOOK_URL}"
    # Escalation: on-call engineer + Engineering Team lead, same-day review

  - name: sev3-review-queue
    webhook_configs:
      - url: "${SEV3_QUEUE_WEBHOOK_URL}"
    # Escalation: logged, reviewed within 48 hours by owning team

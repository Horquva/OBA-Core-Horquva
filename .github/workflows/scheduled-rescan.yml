# Part K — Security Automation & Orchestration
# Runs the full security gate on a schedule, independent of pull requests,
# because a dependency or base image can become vulnerable AFTER merge when
# a new CVE is disclosed (Day 2 §4.2 note: dependency scan triggers).

name: Scheduled Security Rescan

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}    # allow manual on-demand trigger

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  full-rescan:
    name: Full Security Gate (scheduled)
    uses: ./.github/workflows/security-gate.yml
    # A calling job must explicitly grant every permission the reusable
    # workflow's own jobs need — top-level workflow permissions above are
    # NOT automatically passed through. security-gate.yml's SAST job needs
    # pull-requests: write (missing here previously), which is why this
    # job failed to even start ("Startup failure") rather than failing
    # partway through.
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit

  notify-on-failure:
    name: Notify DevSecOps on new findings
    needs: full-rescan
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post notification
        run: |
          echo "::warning::Scheduled rescan found new blocking issues — notify DevSecOps Platform Owner."
          # Replace with real webhook, e.g.:
          # curl -X POST -H 'Content-Type: application/json' \
          #   -d '{"text":"Scheduled Sentinel rescan failed — see workflow run for details."}' \
          #   "${{ secrets.SECURITY_ALERTS_WEBHOOK_URL }}"

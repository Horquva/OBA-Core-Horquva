name: Scheduled Security Rescan

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  full-rescan:
    name: Full Security Gate (scheduled)
    uses: ./.github/workflows/security-gate.yml
    # FIX: reusable-workflow calls need explicit job-level permissions
    # matching what the called workflow needs — top-level permissions
    # above are NOT automatically passed through. Missing pull-requests:
    # write here previously caused a full "Startup failure".
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit

  notify-on-failure:
    name: Notify DevSecOps on new findings
    needs: full-rescan
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post notification
        run: |
          echo "::warning::Scheduled rescan found new blocking issues — notify DevSecOps Platform Owner."

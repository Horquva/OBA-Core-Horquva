# Part F & I — SBOM Generation + Build Provenance
# Runs after a successful build; produces the evidence artifacts required
# before signing (artifact-signing/signing-scripts/sign-artifact.sh).

name: SBOM & Provenance Generation

on:
  workflow_call:
    inputs:
      image-ref:
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # required for keyless cosign signing (OIDC)

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (Syft, CycloneDX format)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.image-ref }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM (evidence)
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 365   # SBOMs retained long-term for supply-chain audit

  provenance:
    name: Generate Build Provenance
    needs: sbom
    runs-on: ubuntu-latest
    steps:
      - name: Record build provenance metadata
        run: |
          cat <<EOF > provenance.json
          {
            "builder": "github-actions",
            "buildType": "sentinel-devsecops-ci",
            "invocation": {
              "configSource": {
                "repository": "${{ github.repository }}",
                "ref": "${{ github.ref }}",
                "commit": "${{ github.sha }}"
              },
              "workflow": "${{ github.workflow }}",
              "runId": "${{ github.run_id }}"
            },
            "materials": [
              { "uri": "git+https://github.com/${{ github.repository }}", "digest": { "sha1": "${{ github.sha }}" } }
            ]
          }
          EOF

      - name: Upload provenance (evidence)
        uses: actions/upload-artifact@v7
        with:
          name: provenance
          path: provenance.json
          retention-days: 365

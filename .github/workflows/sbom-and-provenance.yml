name: SBOM & Provenance Generation

on:
  workflow_call:
    inputs:
      image-ref:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (Syft, CycloneDX format)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.image-ref }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM (evidence)
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 365

  provenance:
    name: Generate Build Provenance
    needs: sbom
    runs-on: ubuntu-latest
    steps:
      # FIX: "builder" must be an OBJECT with an "id" field, not a plain
      # string — Cosign's SLSA predicate validator rejected the previous
      # string-only version with "cannot unmarshal string into Go struct
      # field ProvenancePredicate.builder".
      - name: Record build provenance metadata
        run: |
          cat <<EOF > provenance.json
          {
            "builder": {
              "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            },
            "buildType": "https://github.com/actions/runner",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": "${{ github.workflow }}"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}"
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            ]
          }
          EOF

      - name: Upload provenance (evidence)
        uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: provenance.json
          retention-days: 365

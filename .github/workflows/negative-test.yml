# Part R — Security Validation, Negative Testing & Resilience Engineering
#
# This is the operational evidence the review asked for: every job here
# deliberately introduces a real, known-bad input (fake secret, vulnerable
# dependency, vulnerable container, misconfigured IaC, unsigned artifact)
# against the SAFE fixtures in testing/negative-test-fixtures/ — never
# against real source — and asserts that the corresponding gate actually
# detects and blocks it. A green run of this workflow IS the "positive +
# controlled negative case" evidence required per Part R.
#
# Run manually (Actions tab -> this workflow -> Run workflow) whenever
# operational evidence needs to be (re)generated. Never runs on push/PR —
# it is a proof exercise, not a normal gate.

name: Negative Security Testing (Resilience Check)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # required to push the throwaway test images used below
  id-token: write   # required for keyless Cosign signing

jobs:
  # ---------------------------------------------------------------------
  # 1. Secret detection: fake AWS-format credential must be caught.
  # ---------------------------------------------------------------------
  verify-secret-detection-blocks:
    name: "Evidence: Secret detection blocks a known-fake secret"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Gitleaks CLI
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks against the fixture directory only
        id: gitleaks
        continue-on-error: true
        run: |
          gitleaks detect \
            --source testing/negative-test-fixtures/ \
            --config security-gates/secret-detection/gitleaks-rules/.gitleaks.toml \
            --report-format json \
            --report-path gitleaks-negative-test-result.json \
            --redact

      - name: Assert detection occurred (this IS the evidence)
        run: |
          if [ "${{ steps.gitleaks.outcome }}" != "failure" ]; then
            echo "::error::RESILIENCE FAILURE — secret detection did NOT flag the known fixture. Gate is not working."
            exit 1
          fi
          echo "PASS — secret detection correctly flagged the fixture and would have blocked the pipeline."

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-secret-detection
          path: gitleaks-negative-test-result.json
          retention-days: 365
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # 2. Dependency scan: known-vulnerable lodash version must be caught.
  # ---------------------------------------------------------------------
  verify-dependency-scan-blocks:
    name: "Evidence: Dependency scan blocks a known-vulnerable package"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run npm audit against fixture package.json
        id: depcheck
        continue-on-error: true
        run: |
          cd testing/negative-test-fixtures
          npm audit --audit-level=critical --json > audit-result.json || exit 1

      - name: Assert detection occurred (this IS the evidence)
        run: |
          if [ "${{ steps.depcheck.outcome }}" != "failure" ]; then
            echo "::error::RESILIENCE FAILURE — dependency scan did NOT flag the known-vulnerable fixture."
            exit 1
          fi
          echo "PASS — dependency scan correctly flagged the fixture and would have blocked the pipeline."

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-dependency-scan
          path: testing/negative-test-fixtures/audit-result.json
          retention-days: 365
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # 3. Container scan: deliberately old/vulnerable base image must be caught.
  # ---------------------------------------------------------------------
  verify-container-scan-blocks:
    name: "Evidence: Container scan blocks a known-vulnerable image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the deliberately vulnerable fixture image
        run: |
          docker build -t sentinel-negative-test-container:${{ github.run_id }} \
            -f testing/negative-test-fixtures/Dockerfile.vulnerable \
            testing/negative-test-fixtures/

      - name: Run Trivy against the fixture image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "sentinel-negative-test-container:${{ github.run_id }}"
          format: "json"
          output: "trivy-negative-test-result.json"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Assert detection occurred (this IS the evidence)
        run: |
          if [ "${{ steps.trivy.outcome }}" != "failure" ]; then
            echo "::error::RESILIENCE FAILURE — container scan did NOT flag the known-vulnerable fixture image."
            exit 1
          fi
          echo "PASS — container scan correctly flagged the fixture image and would have blocked the pipeline."

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-container-scan
          path: trivy-negative-test-result.json
          retention-days: 365
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # 4. IaC scan: deliberately misconfigured Terraform must be caught.
  # ---------------------------------------------------------------------
  verify-iac-scan-blocks:
    name: "Evidence: IaC scan blocks a known misconfiguration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov against the fixture Terraform only
        id: checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@master
        with:
          directory: testing/negative-test-fixtures/terraform/
          output_format: json
          output_file_path: checkov-negative-test-result.json
          soft_fail: false

      - name: Assert detection occurred (this IS the evidence)
        run: |
          if [ "${{ steps.checkov.outcome }}" != "failure" ]; then
            echo "::error::RESILIENCE FAILURE — IaC scan did NOT flag the known misconfiguration."
            exit 1
          fi
          echo "PASS — IaC scan correctly flagged the fixture and would have blocked the pipeline."

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-iac-scan
          path: checkov-negative-test-result.json
          retention-days: 365
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # 5. Artifact signing: real sign + real verify (positive), then verify
  #    against a real UNSIGNED image and confirm rejection (negative).
  # ---------------------------------------------------------------------
  verify-signing-and-verification:
    name: "Evidence: Artifact signing works and unsigned artifacts are rejected"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push a real (tiny) test image — SIGNED case
        id: signed
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/negative-test-signed:${{ github.run_id }}"
          echo "FROM alpine:latest" | docker build -t "$IMAGE" -
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Sign the test image (real Cosign signing, not simulated)
        run: bash artifact-signing/signing-scripts/sign-artifact.sh "${{ steps.signed.outputs.image }}"

      - name: Verify the SIGNED image — must PASS
        id: verify-signed
        run: bash artifact-signing/verification-scripts/verify-artifact.sh "${{ steps.signed.outputs.image }}"

      - name: Build and push a second test image — UNSIGNED case (never signed)
        id: unsigned
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/negative-test-unsigned:${{ github.run_id }}"
          echo "FROM alpine:latest" | docker build -t "$IMAGE" -
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          # Deliberately NOT signing this one.

      - name: Verify the UNSIGNED image — must FAIL (this IS the negative-case evidence)
        id: verify-unsigned
        continue-on-error: true
        run: bash artifact-signing/verification-scripts/verify-artifact.sh "${{ steps.unsigned.outputs.image }}"

      - name: Assert rejection occurred
        run: |
          if [ "${{ steps.verify-unsigned.outcome }}" != "failure" ]; then
            echo "::error::RESILIENCE FAILURE — an unsigned image PASSED verification. This is a critical control failure."
            exit 1
          fi
          echo "PASS — signed image verified successfully; unsigned image was correctly rejected."

  # ---------------------------------------------------------------------
  resilience-report:
    name: Control Effectiveness Report (Part R evidence)
    needs:
      - verify-secret-detection-blocks
      - verify-dependency-scan-blocks
      - verify-container-scan-blocks
      - verify-iac-scan-blocks
      - verify-signing-and-verification
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Part R Control Effectiveness Report ==="
          echo "Secret detection gate:        ${{ needs.verify-secret-detection-blocks.result }}"
          echo "Dependency scan gate:         ${{ needs.verify-dependency-scan-blocks.result }}"
          echo "Container scan gate:          ${{ needs.verify-container-scan-blocks.result }}"
          echo "IaC scan gate:                ${{ needs.verify-iac-scan-blocks.result }}"
          echo "Signing / verification gate:  ${{ needs.verify-signing-and-verification.result }}"
          echo ""
          echo "This run's URL is the operational evidence link for the Part A-U Acceptance Matrix."

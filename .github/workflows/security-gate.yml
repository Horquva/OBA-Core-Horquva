# Part D & E — Security Gate Engineering, Policy Enforcement & Security Scanning
# This is Sentinel's ONE централized security gate. Every repository calls this —
# no repository re-implements its own scanning logic (One Source of Truth).
#
# Blocking behaviour:
#   Critical / High  -> pipeline fails (job exits non-zero)
#   Medium           -> pipeline fails unless a logged, unexpired waiver exists
#   Low / Info       -> recorded only, does not block

name: Reusable Security Gate

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # FIX: semgrep-action has no "SEMGREP_RULES" env var — that was never
      # a real input, so our custom rules (security-gates/sast/semgrep-rules/)
      # were silently never loaded, and only the community registry configs
      # ran. Confirmed by a real negative test on 2026-xx-xx: a deliberately
      # rule-matching fixture (testing/negative-test-fixtures/sast-trigger.js)
      # passed cleanly when it should have been blocked. Fixed by passing
      # every config (registry + local custom rules) directly via the
      # action's own "config" input, which accepts a comma-separated list.
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit,p/secrets,p/owasp-top-ten,p/nodejsscan,security-gates/sast/semgrep-rules/
          # Fails the step (blocking) on ERROR-severity findings

      - name: Upload SAST results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: semgrep.sarif
          retention-days: 90

  secret-detection:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — catches secrets in prior commits, not just HEAD

      # Using the gitleaks CLI directly (not gitleaks/gitleaks-action) —
      # the Action wrapper now requires a paid license for GitHub
      # organizations. The underlying gitleaks tool itself is free/open
      # source (MIT licensed); running it directly avoids that requirement.
      - name: Install Gitleaks CLI
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --config security-gates/secret-detection/gitleaks-rules/.gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --redact
        # Any detected secret is treated as compromised — this step blocks unconditionally
        # (gitleaks exits non-zero on any finding), per Part G (Secret Management):
        # detection = automatic rotation required, no waiver path.

      - name: Upload secret scan results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: gitleaks-report.sarif
          retention-days: 90
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency Scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ROLLOUT NOTE: continue-on-error is temporary. This repository has
      # pre-existing dependencies with Critical/High findings (tracked in
      # governance/exception-register-template.csv) that predate this gate's
      # introduction. Blocking every future PR on legacy debt isn't useful —
      # standard practice is to roll a new gate out in report-only mode,
      # remediate the existing debt on its own timeline, THEN flip this gate
      # back to blocking (remove continue-on-error) once the register is clear.
      - name: Run OWASP Dependency-Check
        id: depcheck
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "sentinel-devsecops"
          path: "."
          format: "SARIF"
          args: >
            --failOnCVSS 7
            --suppression security-gates/dependency-scan/owasp-dependency-check/suppression.xml

      - name: Upload dependency scan results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 90

      - name: Surface findings even though gate is in report-only mode
        if: steps.depcheck.outcome == 'failure'
        run: |
          echo "::warning::Dependency scan found Critical/High findings — see dependency-check-report artifact. This gate is currently non-blocking (rollout mode); findings must still be logged in governance/exception-register-template.csv and remediated on the SLA defined in security-gates/dependency-scan/policies/severity-policy.json."

  iac-scan:
    name: Infrastructure-as-Code Scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          config_file: infra/terraform/policies/checkov-config.yaml
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false   # blocking — hard fail on policy violation

      - name: Upload IaC scan results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-scan-report
          path: checkov-results.sarif
          retention-days: 90

  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile-check
        run: |
          if [ -f "Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Dockerfile at repo root — this repository isn't containerized yet, skipping container scan."
          fi

      - name: Build image for scanning
        if: steps.dockerfile-check.outputs.exists == 'true'
        run: docker build -t sentinel-scan-target:${{ github.sha }} . --file Dockerfile

      - name: Run Trivy
        if: steps.dockerfile-check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "sentinel-scan-target:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"          # blocking
          trivyignores: "container-security/image-scanning/trivy-config/.trivyignore"

      - name: Upload container scan results (evidence)
        if: always() && steps.dockerfile-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-report
          path: trivy-results.sarif
          retention-days: 90
          if-no-files-found: ignore

  gate-summary:
    name: Security Gate Decision (Policy Evaluation)
    needs: [sast, secret-detection, dependency-scan, iac-scan, container-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate combined gate result
        run: |
          echo "SAST:              ${{ needs.sast.result }}"
          echo "Secret Detection:   ${{ needs.secret-detection.result }}"
          echo "Dependency Scan:    ${{ needs.dependency-scan.result }}"
          echo "IaC Scan:           ${{ needs.iac-scan.result }}"
          echo "Container Scan:     ${{ needs.container-scan.result }}"

          for r in "${{ needs.sast.result }}" "${{ needs.secret-detection.result }}" "${{ needs.dependency-scan.result }}" "${{ needs.iac-scan.result }}" "${{ needs.container-scan.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::Security gate FAILED — one or more blocking checks did not pass."
              exit 1
            fi
          done
          echo "::notice::All security gates passed."

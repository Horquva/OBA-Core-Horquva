name: Reusable Security Gate

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # FIX: semgrep-action has no "SEMGREP_RULES" env var — that was never
      # a real input, so our custom rules were silently never loaded, and
      # only community registry configs ran. Fixed by passing every config
      # (registry + local custom rules) directly via the action's own
      # "config" input, which accepts a comma-separated list.
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit,p/secrets,p/owasp-top-ten,p/nodejsscan,security-gates/sast/semgrep-rules/

      - name: Upload SAST results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: semgrep.sarif
          retention-days: 90

  secret-detection:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Using the gitleaks CLI directly (not gitleaks/gitleaks-action) —
      # the Action wrapper now requires a paid license for GitHub
      # organizations. The underlying gitleaks tool itself is free/open
      # source; running it directly avoids that requirement.
      - name: Install Gitleaks CLI
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --config security-gates/secret-detection/gitleaks-rules/.gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --redact
        # Any detected secret is treated as compromised — blocks unconditionally.
        # The production config (.gitleaks.toml) excludes the known,
        # deliberately-fake test fixture value used by negative-test.yml
        # (via value-based allowlist, proven reliable) so it doesn't
        # perpetually block real PRs while still genuinely detecting anything else.

      - name: Upload secret scan results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: gitleaks-report.sarif
          retention-days: 90
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency Scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ROLLOUT NOTE: continue-on-error is temporary and formally logged as
      # PLATFORM-EXC-2026-001 in governance/PLATFORM-ROLLOUT-EXCEPTIONS.md.
      # This repository has pre-existing Critical/High dependency findings
      # that predate this gate's introduction. Standard rollout practice:
      # report-only mode, remediate legacy debt, THEN flip to blocking.
      # NOTE (Part 3, Task 7 — immutable references): this action publishes
      # no version tags upstream — only @main is documented/supported by
      # its maintainers. Pinning to a specific commit SHA would be more
      # correct but requires periodic manual re-verification since no
      # tagged releases exist to pin against. Flagged as a known,
      # documented exception rather than silently left as a generic risk.
      - name: Run OWASP Dependency-Check
        id: depcheck
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "sentinel-devsecops"
          path: "."
          format: "SARIF"
          args: >
            --failOnCVSS 7
            --suppression security-gates/dependency-scan/owasp-dependency-check/suppression.xml

      - name: Upload dependency scan results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 90

      - name: Surface findings even though gate is in report-only mode
        if: steps.depcheck.outcome == 'failure'
        run: |
          echo "::warning::Dependency scan found Critical/High findings — see dependency-check-report artifact. Gate is currently non-blocking (rollout mode); findings must be logged in governance/exception-register-template.csv and remediated on the SLA defined in security-gates/dependency-scan/policies/severity-policy.json."

  iac-scan:
    name: Infrastructure-as-Code Scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: infra/
          config_file: infra/terraform/policies/checkov-config.yaml
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false

      - name: Upload IaC scan results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-scan-report
          path: checkov-results.sarif
          retention-days: 90

  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile-check
        run: |
          if [ -f "Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Dockerfile at repo root — skipping container scan."
          fi

      - name: Build image for scanning
        if: steps.dockerfile-check.outputs.exists == 'true'
        run: docker build -t sentinel-scan-target:${{ github.sha }} . --file Dockerfile

      - name: Run Trivy
        if: steps.dockerfile-check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "sentinel-scan-target:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          trivyignores: "container-security/image-scanning/trivy-config/.trivyignore"

      - name: Upload container scan results (evidence)
        if: always() && steps.dockerfile-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-report
          path: trivy-results.sarif
          retention-days: 90
          if-no-files-found: ignore

  gate-summary:
    name: Security Gate Decision (Policy Evaluation)
    needs: [sast, secret-detection, dependency-scan, iac-scan, container-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate combined gate result
        id: decision
        run: |
          echo "SAST:              ${{ needs.sast.result }}"
          echo "Secret Detection:   ${{ needs.secret-detection.result }}"
          echo "Dependency Scan:    ${{ needs.dependency-scan.result }}"
          echo "IaC Scan:           ${{ needs.iac-scan.result }}"
          echo "Container Scan:     ${{ needs.container-scan.result }}"

          BLOCKED=false
          for r in "${{ needs.sast.result }}" "${{ needs.secret-detection.result }}" "${{ needs.dependency-scan.result }}" "${{ needs.iac-scan.result }}" "${{ needs.container-scan.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              BLOCKED=true
            fi
          done
          echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"

      # Part 2, Task 8 — capture a complete, reconstructable evidence record
      # for every blocked run: repository, branch, commit, PR/workflow,
      # per-control finding result, policy decision, gate decision,
      # timestamp, and artifact reference. Written even when NOT blocked,
      # so every run (not only failures) has a matching evidence record.
      - name: Write gate decision evidence record
        run: |
          cat <<EOF > gate-decision-evidence.json
          {
            "event_id": "SNTL-EVT-${{ github.run_id }}-gate",
            "event_type": "${{ steps.decision.outputs.blocked == 'true' && 'security_gate_blocked' || 'security_gate_passed' }}",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.head_ref || github.ref_name }}",
            "commit": "${{ github.sha }}",
            "pull_request": "${{ github.event.pull_request.number || 'n/a' }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "control_results": {
              "sast": "${{ needs.sast.result }}",
              "secret_detection": "${{ needs.secret-detection.result }}",
              "dependency_scan": "${{ needs.dependency-scan.result }}",
              "iac_scan": "${{ needs.iac-scan.result }}",
              "container_scan": "${{ needs.container-scan.result }}"
            },
            "policy_decision": "${{ steps.decision.outputs.blocked == 'true' && 'VIOLATION' || 'COMPLIANT' }}",
            "decision": "${{ steps.decision.outputs.blocked == 'true' && 'BLOCK' || 'ALLOW' }}"
          }
          EOF
          cat gate-decision-evidence.json

      - name: Upload gate decision evidence (always, pass or block)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-decision-evidence-${{ github.run_id }}
          path: gate-decision-evidence.json
          retention-days: 365

      - name: Enforce gate decision
        run: |
          if [ "${{ steps.decision.outputs.blocked }}" = "true" ]; then
            echo "::error::Security gate FAILED — one or more blocking checks did not pass. See gate-decision-evidence artifact for the full record."
            exit 1
          fi
          echo "::notice::All security gates passed."

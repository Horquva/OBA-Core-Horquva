# Part Q — DevSecOps Evidence, Auditability & Engineering Traceability
# Collects every evidence artifact produced by a pipeline run (SAST,
# dependency, secret, IaC, container, SBOM, provenance, deployment) into
# one traceable Engineering Evidence Package.

name: Build Evidence Package

on:
  workflow_run:
    workflows: ["CI - Build, Test & Security Gate", "CD - Staging & Production Deployment"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  package-evidence:
    name: Assemble Engineering Evidence Package
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts from the triggering run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: ./evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write evidence manifest
        run: |
          cat <<EOF > ./evidence/manifest.json
          {
            "repository": "${{ github.repository }}",
            "triggering_workflow": "${{ github.event.workflow_run.name }}",
            "triggering_run_id": "${{ github.event.workflow_run.id }}",
            "commit": "${{ github.event.workflow_run.head_sha }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "contents": $(ls ./evidence | jq -R -s -c 'split("\n") | map(select(length > 0))')
          }
          EOF

      - name: Package evidence
        run: |
          cd evidence
          zip -r ../evidence-package-${{ github.event.workflow_run.head_sha }}.zip .

      - name: Upload Engineering Evidence Package
        uses: actions/upload-artifact@v4
        with:
          name: engineering-evidence-package-${{ github.event.workflow_run.head_sha }}
          path: evidence-package-${{ github.event.workflow_run.head_sha }}.zip
          retention-days: 365   # long retention — this is the audit trail

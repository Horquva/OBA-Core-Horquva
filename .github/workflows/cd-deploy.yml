name: CD - Staging & Production Deployment

on:
  workflow_run:
    workflows: ["CI - Build, Test & Security Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-image:
    name: Build & Push Artifact
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.build.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase repository name (Docker/GHCR require lowercase)
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build container image
        id: build
        run: |
          IMAGE="ghcr.io/${{ steps.repo.outputs.lower }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image-ref=$IMAGE" >> "$GITHUB_OUTPUT"

  generate-evidence:
    name: Generate SBOM & Provenance
    needs: build-image
    uses: ./.github/workflows/sbom-and-provenance.yml
    permissions:
      contents: read
      id-token: write
    with:
      image-ref: ${{ needs.build-image.outputs.image-ref }}

  sign-artifact:
    name: Sign Artifact (using real provenance)
    needs: [build-image, generate-evidence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FIX: sign-artifact.sh needs a real provenance.json — previously
      # never downloaded into this job, so signing attested nothing real.
      - name: Download provenance produced by generate-evidence
        uses: actions/download-artifact@v4
        with:
          name: provenance
          path: .

      - name: Verify provenance.json was actually downloaded
        run: |
          if [ ! -f provenance.json ]; then
            echo "::error::provenance.json missing — refusing to sign without real provenance."
            exit 1
          fi

      - name: Sign artifact
        run: bash artifact-signing/signing-scripts/sign-artifact.sh "${{ needs.build-image.outputs.image-ref }}"

  deploy-staging:
    name: Deploy to Staging [DESIGN-ONLY]
    needs: [build-image, sign-artifact]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Verify artifact before deploy
        run: bash artifact-signing/verification-scripts/verify-artifact.sh "${{ needs.build-image.outputs.image-ref }}"

      - name: Deploy to staging (PLACEHOLDER — not a real deployment command)
        run: |
          echo "::warning::Design-only placeholder — not a real deployment."
          echo "Would deploy ${{ needs.build-image.outputs.image-ref }} to staging..."

      - name: Run smoke tests (PLACEHOLDER)
        run: echo "::warning::Smoke test step is a placeholder."

  approval-gate:
    name: Production Approval Gate
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - name: Approval recorded
        run: echo "Production deployment approved by required reviewer."

  deploy-production:
    name: Deploy to Production [DESIGN-ONLY]
    needs: [build-image, approval-gate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify artifact before deploy (defense in depth)
        run: bash artifact-signing/verification-scripts/verify-artifact.sh "${{ needs.build-image.outputs.image-ref }}"

      - name: Deploy to production (PLACEHOLDER — not a real deployment command)
        run: |
          echo "::warning::Design-only placeholder — not a real deployment."
          echo "Would deploy ${{ needs.build-image.outputs.image-ref }} to production..."

      - name: Record deployment evidence
        run: |
          echo "{\"artifact\":\"${{ needs.build-image.outputs.image-ref }}\",\"deployed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"commit\":\"${{ github.sha }}\",\"actor\":\"${{ github.actor }}\",\"status\":\"design-only-placeholder\"}" > deployment-evidence.json

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: deployment-evidence.json
          retention-days: 365

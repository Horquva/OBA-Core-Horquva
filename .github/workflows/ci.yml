name: Engineering Operations CI

# Day 5: this workflow runs automatically whenever someone pushes work
# inside this service (lifecycle-service/), or opens a Pull Request
# against the "antares-team" branch. If lint/build/tests fail, GitHub
# shows a red "X" on the PR — so no broken output can silently slip
# into the "antares-team" branch.

on:
  push:
    branches: [antares-team]
    paths:
      - "ecosystem/applications/antares/services/lifecycle-service/**"
  pull_request:
    branches: [antares-team]
    paths:
      - "ecosystem/applications/antares/services/lifecycle-service/**"

jobs:
  ci:
    name: Lint + Build + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecosystem/applications/antares/services/lifecycle-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run full CI pipeline (lint -> build -> tests)
        run: npm run ci

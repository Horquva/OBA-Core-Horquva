# Part F — Software Supply Chain Security: Automated Dependency Monitoring
version: 2
updates:
  # Application dependencies (Node.js example — adjust ecosystem per repository)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security-gate:dependency-scan"
    commit-message:
      prefix: "chore(deps)"
    # Critical/High severity security updates are prioritized automatically by Dependabot

  # GitHub Actions themselves must be pinned and kept current (supply-chain hardening)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci-cd"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "container-security"

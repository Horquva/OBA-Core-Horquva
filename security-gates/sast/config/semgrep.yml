# --- Severity policy (Part D: Security Gate Engineering) ---
# ERROR    -> blocks pipeline immediately (maps to Critical/High)
# WARNING  -> blocks pipeline unless waived (maps to Medium)
# INFO     -> recorded only, does not block (maps to Low)

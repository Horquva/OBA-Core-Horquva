# Sentinel Custom SAST Rules
# These supplement the community rulesets in config/semgrep.yml with
# organization-specific patterns.

rules:
  - id: sentinel-no-hardcoded-secret-service-url
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >
      Direct hardcoded credentials/URLs for Sentinel's Secrets Service are not allowed.
      Retrieve secrets at runtime via the approved Secrets Service SDK instead.
    patterns:
      - pattern-either:
          - pattern: $VAR = "sk_live_..."
          - pattern: $VAR = "AKIA..."
    metadata:
      category: security
      constitutional-principle: "Secure by Default"

  - id: sentinel-no-disabled-tls-verification
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >
      Disabling TLS/certificate verification violates Sentinel's Zero Trust
      Engineering principle. All service-to-service calls must be authenticated
      and encrypted.
    patterns:
      - pattern-either:
          - pattern: rejectUnauthorized = false
          - pattern: verify = False
    metadata:
      category: security
      constitutional-principle: "Zero Trust Engineering"

  - id: sentinel-no-wildcard-cors
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Wildcard CORS origin ("*") should not be used on services handling
      authenticated or sensitive data. Specify explicit allowed origins.
    patterns:
      - pattern: 'cors({ origin: "*" })'
    metadata:
      category: security
      constitutional-principle: "Least Privilege"

# Part G — Secret Detection: Pre-commit layer (blocks locally, before push)
# Install: pip install pre-commit --break-system-packages && pre-commit install

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: "Sentinel — Secret Detection (pre-commit)"
        entry: gitleaks protect --staged --config security-gates/secret-detection/gitleaks-rules/.gitleaks.toml
        language: golang

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: detect-private-key
      - id: check-merge-conflict

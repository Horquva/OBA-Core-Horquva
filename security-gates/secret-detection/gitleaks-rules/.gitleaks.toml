title = "Sentinel Gitleaks Configuration — Part G: Secret Management"

# Extend Gitleaks' default, well-maintained ruleset (AWS keys, GCP keys,
# private keys, generic API key patterns, etc.) rather than reinventing it.
[extend]
useDefault = true

# --- Sentinel-specific patterns ---
[[rules]]
id = "sentinel-secrets-service-token"
description = "Sentinel Secrets Service internal access token"
regex = '''sntl_(live|test)_[A-Za-z0-9]{32,}'''
tags = ["sentinel", "secret", "critical"]

[[rules]]
id = "sentinel-internal-service-account-key"
description = "Sentinel internal machine identity credential"
regex = '''sntl-svc-[a-z0-9]{16}\.[A-Za-z0-9+/=]{40,}'''
tags = ["sentinel", "secret", "critical"]

# --- Allowlist: reduce false positives without disabling detection entirely ---
# NOTE: deliberately does NOT match testing/negative-test-fixtures/ — those
# fixtures exist specifically so this scanner SHOULD flag them (Part R).
[allowlist]
description = "Known safe test fixtures only — never production paths"
paths = [
  '''(.*)/safe-fixtures/(.*)''',
  '''(.*)\.md$''',
]
regexes = [
  # Placeholder example values explicitly marked as fake in docs (not in negative-test-fixtures)
  '''EXAMPLE_(KEY|TOKEN|SECRET)_DO_NOT_USE''',
]

title = "Sentinel Gitleaks Configuration — Part G: Secret Management (PRODUCTION)"

# Extend Gitleaks' default, well-maintained ruleset (AWS keys, GCP keys,
# private keys, generic API key patterns, etc.) rather than reinventing it.
[extend]
useDefault = true

# --- Sentinel-specific patterns ---
[[rules]]
id = "sentinel-secrets-service-token"
description = "Sentinel Secrets Service internal access token"
regex = '''sntl_(live|test)_[A-Za-z0-9]{32,}'''
tags = ["sentinel", "secret", "critical"]

[[rules]]
id = "sentinel-internal-service-account-key"
description = "Sentinel internal machine identity credential"
regex = '''sntl-svc-[a-z0-9]{16}\.[A-Za-z0-9+/=]{40,}'''
tags = ["sentinel", "secret", "critical"]

# --- Allowlist ---
#
# IMPORTANT: This is the PRODUCTION config, used by the real security-gate.yml
# that scans the whole repository on every PR. testing/negative-test-fixtures/
# permanently contains a deliberately fake, known-bad credential used to
# PROVE the scanner works (see .github/workflows/negative-test.yml).
#
# Path-based exclusion (excluding the whole folder by path regex) was tried
# first and did NOT reliably suppress the finding in production runs —
# root cause unconfirmed. Value-based exclusion (naming the exact fake
# secret string here) was already empirically proven to work reliably
# (this is literally how the original detection bug was diagnosed and
# fixed earlier — removing a value from this list restored detection).
# Using that same proven mechanism here instead.
#
# The dedicated proof test in negative-test.yml does NOT use this config —
# it uses .gitleaks-negative-test.toml (no exclusion at all), so detection
# is still genuinely exercised and verified there.
[allowlist]
description = "Known safe test fixtures only — never production paths"
paths = [
  '''(.*)/safe-fixtures/(.*)''',
  '''(.*)\.md$''',
  '''test_day5_services\.py''',
  '''store\.json''',
]
regexes = [
  '''EXAMPLE_(KEY|TOKEN|SECRET)_DO_NOT_USE''',
  '''AKIAZ9X4Q7T2R8M5N1K3''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''zK9mQ2wRfPxT7Lb3VnJhY6sD1cA4eG8uH5oI0pW''',
]

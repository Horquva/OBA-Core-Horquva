title = "Sentinel Gitleaks Configuration — Part R: Negative Test Proof (TEST-ONLY)"
#
# This config is used ONLY by .github/workflows/negative-test.yml's
# verify-secret-detection-blocks job. It must NEVER exclude
# testing/negative-test-fixtures/ — the entire point of that job is to
# prove the fixture IS detected. Do not copy the production exclusion here.
#
# For the production config used by the real security-gate.yml (which
# correctly excludes this known test fixture so real PRs aren't perpetually
# blocked by it), see .gitleaks.toml in this same folder.

[extend]
useDefault = true

[[rules]]
id = "sentinel-secrets-service-token"
description = "Sentinel Secrets Service internal access token"
regex = '''sntl_(live|test)_[A-Za-z0-9]{32,}'''
tags = ["sentinel", "secret", "critical"]

[[rules]]
id = "sentinel-internal-service-account-key"
description = "Sentinel internal machine identity credential"
regex = '''sntl-svc-[a-z0-9]{16}\.[A-Za-z0-9+/=]{40,}'''
tags = ["sentinel", "secret", "critical"]

[allowlist]
description = "Docs-only placeholders — deliberately NOT excluding negative-test-fixtures"
paths = [
  '''(.*)/safe-fixtures/(.*)''',
  '''(.*)\.md$''',
]
regexes = [
  '''EXAMPLE_(KEY|TOKEN|SECRET)_DO_NOT_USE''',
]

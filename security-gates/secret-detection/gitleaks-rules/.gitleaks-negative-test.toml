title = "Sentinel Gitleaks Configuration — Part R: Negative Test Proof (TEST-ONLY)"
#
# Used ONLY by negative-test.yml's verify-secret-detection-blocks job.
# Must NEVER exclude testing/negative-test-fixtures/ or the specific fake
# values used there — the whole point of that job is to prove they ARE
# detected. For the production config (which correctly excludes them so
# real PRs aren't perpetually blocked), see .gitleaks.toml in this folder.

[extend]
useDefault = true

[[rules]]
id = "sentinel-secrets-service-token"
description = "Sentinel Secrets Service internal access token"
regex = '''sntl_(live|test)_[A-Za-z0-9]{32,}'''
tags = ["sentinel", "secret", "critical"]

[[rules]]
id = "sentinel-internal-service-account-key"
description = "Sentinel internal machine identity credential"
regex = '''sntl-svc-[a-z0-9]{16}\.[A-Za-z0-9+/=]{40,}'''
tags = ["sentinel", "secret", "critical"]

[allowlist]
description = "Docs-only placeholders — deliberately NOT excluding negative-test-fixtures"
paths = [
  '''(.*)/safe-fixtures/(.*)''',
  '''(.*)\.md$''',
]
regexes = [
  '''EXAMPLE_(KEY|TOKEN|SECRET)_DO_NOT_USE''',
]

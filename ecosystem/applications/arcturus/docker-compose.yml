version: "3.8"

services:
  api:
    build:
      context: ../../../..
      dockerfile: ecosystem/applications/arcturus/Dockerfile
    container_name: arcturus-engine-api
    ports:
      - "8000:8000"
    environment:
      - ARCTURUS_GEMINI_API_KEY=${ARCTURUS_GEMINI_API_KEY}
      - ARCTURUS_DEBUG=false
    volumes:
      - arcturus-data:/app/ecosystem/applications/arcturus/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: arcturus-web-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  arcturus-data:

name: Sentinel Application Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  appsec-verification:
    name: AppSec Regression & Boundary Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Application Security Test Harness
      run: |
        # Task 25: Execute all 85 regression and boundary tests
        # A single failure here will block the PR from merging.
        python -m pytest -v tests/
name: Knowledge Operationalization Platform — CI

on:
  push:
    branches:
      - "antares/laiba-**"
      - "antares-team"
  pull_request:
    branches:
      - "antares-team"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all 10 days
        run: bash run_all_tests.sh

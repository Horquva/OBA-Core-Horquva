services:
  - type: web
    name: oba-core-backend
    runtime: node
    plan: free
    branch: ocos/develop
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Node 22+ required: @supabase/realtime-js needs native WebSocket
      # support, which Node only ships from v22 onward.
      - key: NODE_VERSION
        value: 22
      # Set these in the Render dashboard (Environment tab) — not committed here.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ORG
        value: horquva
      - key: TOKEN_TTL
        value: 3600
      - key: AGENT_ENABLED
  	value: "false"
      - key: AGENT_PROVIDER
        value: gemini
      - key: AGENT_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_MAX_ITERATIONS
        value: "8"
      - key: AGENT_TURN_TIMEOUT_MS
        value: "120000"
      - key: AGENT_DAILY_TURN_BUDGET
        value: "40"
services:
  - type: web
    name: horquva-continuity-backend
    runtime: node
    plan: starter
    branch: mvp/v1-continuity
    rootDir: backend
    # NODE_ENV=production makes npm skip devDependencies; the build (tsc, vitest types) and start (tsx) need them.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        sync: false
      # The Vercel frontend's origin, for both: the API is reached through its /api proxy.
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      # Demo deployment: shared sign-in instead of SSO (backend/src/auth/demoLogin.ts).
      - key: DEMO_LOGIN_EMAIL
        sync: false
      - key: DEMO_LOGIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      # Supabase session pooler allows 15 clients; old + new instance overlap
      # during a deploy, so each instance stays at 5 + 2 = 7.
      - key: PG_POOL_MAX
        value: "5"
      - key: PGBOSS_POOL_MAX
        value: "2"
      - key: HORQUVA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

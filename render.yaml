services:
  - type: web
    name: oba-core-backend
    runtime: node
    plan: free
    branch: ocos/develop
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Node 22+ required: @supabase/realtime-js needs native WebSocket
      # support, which Node only ships from v22 onward.
      - key: NODE_VERSION
        value: 22
      # Set these in the Render dashboard (Environment tab) — not committed here.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # SEC-2: frontend (Vercel) and backend (Render) are different sites, so
      # the httpOnly session cookie must be SameSite=None; Secure.
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ORG
        value: horquva
      - key: TOKEN_TTL
        value: 3600
